<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Object Properties Demo</title>
</head>
<body>

<h2>Deleting a Property</h2>
<p id="demo"></p>

<script>
    const person = {
        firstName: "Tony",
        lastName: "Lee",
        age: 50,
        eyeColor: "Blue"
    };

    delete person.age;

    document.getElementById("demo").innerHTML = person.firstName + " " + person.lastName + " is " + person.age + " years old" + ", and his eyecolor is " + person.eyeColor + ".";


</script>

</body>
</html>
