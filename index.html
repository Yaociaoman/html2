<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Responsive Layout</title>

<style>
body {
    margin: 0;
    padding: 30px;
    background: #f5f5f5;
    font-family: Arial;
}

.wrapper {
    background: #5aaae6;
    padding: 20px;
}

.container {
    background: #eeeeee;
    border-radius: 12px;
    padding: 12px;
    max-width: 600px;
    margin: auto;
}

.header {
    background: #a8cf45;
    height: 100px;
    margin-bottom: 10px;
}

.middle {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

.middle div {
    background: #18b8c9;
    height: 150px;
    flex: 1;
}

.bottom {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.bottom div {
    background: #cfd6da;
    height: 50px;
    flex: 1 1 calc(25% - 10px);
}

@media (max-width: 480px) {

    .middle {
        flex-direction: column;
    }

    .middle div {
        height: 60px;
    }

    .bottom div {
        flex: 1 1 calc(50% - 10px);  
    }
}

</style>
</head>

<body>

<div class="wrapper">
    <div class="container">

        <div class="header"></div>

        <div class="middle">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="bottom">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>

    </div>
</div>

</body>
</html>
