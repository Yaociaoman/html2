<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Responsive Layout</title>

    <!-- 讓手機正常縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 3 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <style>
        .box {
            height: 100px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .green { background: #a8cf45; }
        .blue { background: #1eb5c1; }
        .gray { background: #cfd8dc; }
        .container-box {
            background: #4ea3d8;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container container-box">

    <div class="row">

        <!-- 左卡片 -->
        <div class="col-xs-12 col-sm-6">
            <div class="card">

                <div class="box green"></div>

                <div class="box blue"></div>
                <div class="box blue"></div>
                <div class="box blue"></div>

                <div class="row">
                    <div class="col-xs-6">
                        <div class="box gray"></div>
                    </div>
                    <div class="col-xs-6">
                        <div class="box gray"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 右卡片 -->
        <div class="col-xs-12 col-sm-6">
            <div class="card">

                <div class="box green"></div>

                <div class="row">
                    <div class="col-xs-12 col-sm-4">
                        <div class="box blue"></div>
                    </div>
                    <div class="col-xs-12 col-sm-4">
                        <div class="box blue"></div>
                    </div>
                    <div class="col-xs-12 col-sm-4">
                        <div class="box blue"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-3">
                        <div class="box gray"></div>
                    </div>
                    <div class="col-xs-3">
                        <div class="box gray"></div>
                    </div>
                    <div class="col-xs-3">
                        <div class="box gray"></div>
                    </div>
                    <div class="col-xs-3">
                        <div class="box gray"></div>
                    </div>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
