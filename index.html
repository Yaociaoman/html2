<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Responsive Layout</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    background: #4ea3d8;
    font-family: Arial;
}

.container {
    width: 90%;
    margin: 20px auto;
    background: white;
    padding: 15px;
    border-radius: 10px;
}

/* 區塊樣式 */
.box {
    height: 100px;
    margin-bottom: 10px;
    border-radius: 5px;
}

.green { background: #a8cf45; }
.blue { background: #1eb5c1; }
.gray { background: #cfd8dc; }

/* 預設：手機（直排） */
.row {
    display: block;
}

/* 🔥 關鍵：螢幕大於480px 時改版 */
@media (min-width: 480px) {

    .row {
        display: flex;
        gap: 10px;
    }

    .blue-group .box {
        flex: 1;
    }

    .gray-group .box {
        flex: 1;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 綠色 -->
    <div class="box green"></div>

    <!-- 藍色區 -->
    <div class="row blue-group">
        <div class="box blue"></div>
        <div class="box blue"></div>
        <div class="box blue"></div>
    </div>

    <!-- 灰色區 -->
    <div class="row gray-group">
        <div class="box gray"></div>
        <div class="box gray"></div>
        <div class="box gray"></div>
        <div class="box gray"></div>
    </div>

</div>

</body>
</html>
