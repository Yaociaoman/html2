<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Responsive Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f5f5f5;
        }

        .wrapper {
            background: #55a9e8;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            gap: 30px;
            flex-wrap: nowrap;
        }

        .card {
            background: #f2f2f2;
            border-radius: 12px;
            padding: 12px;
            width: 320px;
            box-sizing: border-box;
        }

        .top {
            background: #a8cf45;
            height: 100px;
            margin-bottom: 8px;
        }

        .middle {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .middle div {
            background: #17b9cc;
            height: 150px;
            flex: 1;
        }

        .bottom {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bottom div {
            background: #d9e0e3;
            height: 45px;
            flex: 1 1 calc(25% - 8px);
        }

        /* 小於 480px 時改版 */
        @media screen and (max-width: 479px) {
            .wrapper {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 300px;
            }

            .middle {
                flex-direction: column;
            }

            .middle div {
                height: 55px;
            }

            .bottom div {
                flex: 1 1 calc(50% - 8px);
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <div class="top"></div>
            <div class="middle">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="bottom">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>

        <div class="card">
            <div class="top"></div>
            <div class="middle">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="bottom">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>

</body>
</html>
