<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Responsive Layout</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap 3 -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

<style>
body {
    background: #4ea3d8;
}

.container-box {
    background: white;
    padding: 15px;
    margin-top: 20px;
    border-radius: 10px;
}

.box {
    margin-bottom: 10px;
    border-radius: 5px;
}

/* 🔹 預設（手機） */
.green { 
    background: #a8cf45; 
    height: 120px;
}

.blue { 
    background: #1eb5c1; 
    height: 100px;
}

.gray { 
    background: #cfd8dc; 
    height: 80px;
}

/* 🔥 大螢幕時讓綠色變更大 */
@media (min-width: 768px) {
    .green {
        height: 180px;
    }
}
</style>
</head>

<body>

<div class="container container-box">

    <!-- 綠色 -->
    <div class="box green"></div>

    <!-- 藍色 -->
    <div class="row">
        <div class="col-xs-12 col-sm-4">
            <div class="box blue"></div>
        </div>
        <div class="col-xs-12 col-sm-4">
            <div class="box blue"></div>
        </div>
        <div class="col-xs-12 col-sm-4">
            <div class="box blue"></div>
        </div>
    </div>

    <!-- 灰色 -->
    <div class="row">
        <div class="col-xs-6 col-sm-3">
            <div class="box gray"></div>
        </div>
        <div class="col-xs-6 col-sm-3">
            <div class="box gray"></div>
        </div>
        <div class="col-xs-6 col-sm-3">
            <div class="box gray"></div>
        </div>
        <div class="col-xs-6 col-sm-3">
            <div class="box gray"></div>
        </div>
    </div>

</div>

</body>
</html>
