<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Responsive Layout</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

<style>
body {
    background: #4ea3d8;
}

.container-box {
    background: white;
    padding: 15px;
    margin-top: 20px;
    border-radius: 10px;
}

.box {
    height: 100px;
    margin-bottom: 10px;
    border-radius: 5px;
}

.green { 
    background: #a8cf45;
    height: 120px;
}
.blue { 
    background: #1eb5c1;
    height: 100px;
}
.gray { 
    background: #cfd8dc;
    height: 120px;
}

@media (min-width: 768px) {
    .green {
        height: 180px;
    }
}
    
</style>
</head>

<body>

<div class="container container-box">

    <div class="box green"></div>

    <div class="row">
        <div class="col-xs-12 col-sm-4">
            <div class="box blue"></div>
        </div>
        <div class="col-xs-12 col-sm-4">
            <div class="box blue"></div>
        </div>
        <div class="col-xs-12 col-sm-4">
            <div class="box blue"></div>
        </div>
    </div>


    <div class="row">
    
        <div class="col-xs-6 col-sm-3">
            <div class="box gray"></div>
        </div>
        <div class="col-xs-6 col-sm-3">
            <div class="box gray"></div>
        </div>
        <div class="col-xs-6 col-sm-3">
            <div class="box gray"></div>
        </div>
        <div class="col-xs-6 col-sm-3">
            <div class="box gray"></div>
        </div>
    </div>

</div>

</body>
</html>
