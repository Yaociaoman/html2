<!DOCTYPE html>
<html>
<head>
<title>Outline example</title>
<style>
h1{
  font-size: 40px;
  text-decoration: overline;
  text-shadow:2px 2px 5px pink;
}
h2{
  font-size: 30px;
  border: 2px solid black;
  outline-style: outset;
  outline-color: yellow;
  p.itallic{
    font-variant: italic;
  }
}
h3{
  font-size: 20px;
  text-decoration: underline;
  text-align: right;
}
</style>
</head>

<body>

<h1>This is heading 1</h1>
<h2>This is heading 2</h2>
<h3>This is heading 3</h3>

<p class="normal">This is heading 1</p>
<p class="italic">This is heading 2</p>
<p class="italic">This is heading 3</p>


</body>
</html>
