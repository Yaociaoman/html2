<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Responsive Layout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

<style>
body{
    background:#56a9e3;
}

.wrapper{
    background:white;
    padding:15px;
    margin:20px auto;
    border-radius:12px;
    width:90%;
}

.box{
    border:6px solid white;
    box-sizing:border-box;
}

.green{
    background:#a8cf45;
    height:90px;   /* 手機先比較小 */
    margin-bottom:10px;
}

.blue{
    background:#18b7c9;
    height:80px;
    margin-bottom:10px;
}

.gray{
    background:#d9e0e3;
    height:60px;
    margin-bottom:10px;
}

/* 手機版：小於480px */
@media (max-width: 479px){
    .green{
        height:80px;
    }
}

/* 大於等於480px */
@media (min-width: 480px){
    .green{
        height:130px;   /* 綠色區塊變比較大 */
    }

    .blue{
        height:120px;
    }

    .gray{
        height:80px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- 綠色 -->
    <div class="green box"></div>

    <!-- 藍色 -->
    <div class="row">
        <div class="col-xs-12 col-sm-4">
            <div class="blue box"></div>
        </div>
        <div class="col-xs-12 col-sm-4">
            <div class="blue box"></div>
        </div>
        <div class="col-xs-12 col-sm-4">
            <div class="blue box"></div>
        </div>
    </div>

    <!-- 灰色 -->
    <div class="row">
        <div class="col-xs-6 col-sm-3">
            <div class="gray box"></div>
        </div>
        <div class="col-xs-6 col-sm-3">
            <div class="gray box"></div>
        </div>
        <div class="col-xs-6 col-sm-3">
            <div class="gray box"></div>
        </div>
        <div class="col-xs-6 col-sm-3">
            <div class="gray box"></div>
        </div>
    </div>

</div>

</body>
</html>
